[package]
name = "dmesh-fw-transport"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Firmware crates are built with their ESP-IDF SDK workspaces. Keeping this
# crate standalone prevents host-only dependencies from entering the root
# workspace while allowing Recovery and Main to share it directly.
[workspace]

[lib]
name = "dmesh_fw_transport"
path = "src/lib.rs"

[features]
default = []
esp-idf = ["dep:esp-idf-sys", "dep:uart-codec"]
# Firmware consumers select the raw IPv6/UDP bearer.  There is intentionally
# no socket/lwIP bearer feature: link/netif support may still be linked by
# ESP-IDF, but it is not a DMesh transport implementation.
wifi-raw-udp6 = ["esp-idf"]
wifi-raw-udp6-client = ["wifi-raw-udp6"]
wifi-espnow = ["esp-idf", "dep:dmesh-rawnan"]
# Main originates the lab device-to-device client; Recovery remains the small
# shared server canary while reusing the same ESP-NOW receive/transmit hook.
wifi-espnow-client = ["wifi-espnow"]

[dependencies]
quic-lite = { path = "../../crates/quic-lite" }
dmesh-server = { path = "../../crates/dmesh-server", default-features = false }
dmesh-rawnan = { path = "../../crates/rawnan", default-features = false, optional = true }
uart-codec = { path = "../../crates/uart-codec", optional = true }
esp-idf-sys = { version = "0.37", default-features = false, features = ["alloc_handler"], optional = true }
