[package]
name = "dmesh-rs"
version = "0.1.0"
edition = "2021"
resolver = "2"

[workspace]

[features]
default = ["modules", "ble-stack"]
modules = ["dep:dmesh-fw-modules"]
ble-stack = ["dep:dmesh-ble"]
rtos-stats = ["dmesh-fw-transport/rtos-stats"]
udp6-socket = ["dmesh-fw-transport/udp6-socket"]
tcp-stream = ["dmesh-fw-transport/tcp-stream"]

[dependencies]
dmesh-ble = { path = "../ble", optional = true }
dmesh-fw-transport = { path = "../dmesh-fw-transport" }
dmesh-server = { path = "../../crates/dmesh-server", default-features = false }
dmesh-fw-modules = { path = "../modules", optional = true }
quic-lite = { path = "../../crates/quic-lite" }
# The loader upload protocol (verification, state log, one-connection server); see src/loader_flash.rs.
esp-wifi-loader = { git = "https://github.com/costinm/esp-wifi-loader" }
esp-idf-sys = { version = "0.37", default-features = false, features = ["std"] }

[build-dependencies]
embuild = "0.33.3"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../modules/native", "../ble/native", "native"]

[profile.release]
codegen-units = 1
debug = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = false

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git", rev = "8369f610a31e9c90a5479ed7f366f983589dfa0a" }
