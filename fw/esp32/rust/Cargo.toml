[package]
name = "dmesh-rs"
version = "0.1.0"
edition = "2021"
resolver = "2"

[workspace]

[dependencies]
dmesh-rawnan = { path = "../../../crates/rawnan", default-features = false }
dmesh-transport = { path = "../../../crates/dmesh-transport" }
uart-codec = { path = "../../../crates/uart-codec" }
anyhow = "1"
sha2 = { version = "0.11", default-features = false }
embedded-svc = "0.29"
esp-idf-svc = { version = "0.52", default-features = false, features = ["std", "experimental"] }
esp-idf-sys = { version = "0.37", default-features = false, features = ["std"] }
libc = "0.2"
log = "0.4"
minicbor = { version = "2.2", features = ["std"] }

[build-dependencies]
embuild = "0.33.3"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["native"]

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = "z"

# ESP-IDF 6 ships MbedTLS 4, which removed the legacy headers (aes.h,
# cipher.h, etc.).  The released esp-idf-sys 0.37.2 binding template still
# includes them unconditionally.  Until the fix is released, use the
# upstream revision that gates those headers on ESP-IDF < 6.  This regenerates
# bindings against the selected SDK; it is not a checked-in bindings fork.
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git", rev = "8369f610a31e9c90a5479ed7f366f983589dfa0a" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git", rev = "f1bac2d93fe9e92a1df2ad0acd34ef702a791ba4" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git", rev = "f59ffada5638cf582fe8cab1771fa38873ef6d73" }
