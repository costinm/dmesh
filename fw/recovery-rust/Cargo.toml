[package]
name = "dmesh-recovery-rs"
version = "0.2.0"
edition = "2021"
resolver = "2"

[workspace]

[features]
# Recovery's production transport composition is raw IPv6/UDP plus the
# raw ESP-NOW action bearer. The feature names remain only as crate-internal
# dependency wiring; operators do not select a socket fallback.
default = ["wifi-raw-udp6", "wifi-espnow"]
wifi-raw-udp6 = ["dmesh-fw-transport/wifi-raw-udp6"]
wifi-espnow = ["dmesh-fw-transport/wifi-espnow"]

[dependencies]
dmesh-fw-transport = { path = "../dmesh-fw-transport", features = ["esp-idf"] }
# `no_std` here means no Rust std runtime. ESP-IDF, Wi-Fi, UART, and FreeRTOS
# are still linked and called through the generated C bindings.
esp-idf-sys = { version = "0.37", default-features = false, features = ["alloc_handler"] }

[build-dependencies]
embuild = "0.33.3"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true

# ESP-IDF 6 removed legacy MbedTLS headers while the released sys crate still
# includes them unconditionally. Keep the same narrow upstream binding fix as
# the Main firmware until the next esp-idf-sys release.
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git", rev = "8369f610a31e9c90a5479ed7f366f983589dfa0a" }
