<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLE companion</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#62718a;--line:#d5ddeb;--accent:#075ec7;--bad:#a22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
header,main{max-width:1180px;margin:auto;padding:18px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 10px}
main{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.wide{grid-column:1/-1}
section{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;min-width:0}
.muted{color:var(--muted)}.meta{font-size:13px;color:var(--muted)}
button,input,select{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row label{min-width:0;flex:1 1 160px}
label{display:grid;gap:4px;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:13px}.error{color:var(--bad)}pre{max-height:280px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
address{font-style:normal;word-break:break-all}
</style></head>
<body>
<header><h1>BLE companion</h1><p id="status" class="muted">Loading BLE service…</p><p><a href="dashboard.html">Back to mesh discovery</a> · <a href="usb.html">USB serial</a></p></header>
<main>
<section class="wide"><h2>Status</h2><div id="ble-status" class="muted">No status yet.</div><div class="row" style="margin-top:10px"><button id="refresh-status" class="primary">Refresh status</button></div></section>
<section><h2>Scan</h2><div class="row"><button id="scan">Start scan</button><button id="scan-stop">Stop scan</button><button id="clear">Clear results</button><button id="refresh-results">Refresh results</button></div><div id="scan-error" class="error"></div></section>
<section><h2>NAN wake / activation</h2><div class="row"><label>Target radio MAC (STA/AP, not BLE)<input id="target" placeholder="aa:bb:cc:dd:ee:ff"></label><label>Kind<select id="kind"><option value="6">NAN + NOW + AP</option><option value="1">STA</option></select></label><label>BLE<select id="ble"><option value="0">Preserve</option><option value="1">Turn on</option><option value="2">Turn off</option></select></label><label>AP<select id="ap"><option value="1">On</option><option value="0">Off</option></select></label><label>NOW<select id="now"><option value="1">On</option><option value="0">Off</option><option value="2">Preserve</option></select></label><label>DW interval<select id="dw"><option value="1">1</option><option value="8">8</option><option value="16">16</option><option value="0">0</option></select></label><button id="activate" class="primary">Send activation</button></div><div id="activate-error" class="error"></div></section>
<section class="wide"><h2>Scan results</h2><div id="results"><p class="muted">No scan results yet.</p></div></section>
<section class="wide"><h2>Last operation</h2><div id="result" class="muted">No operation yet.</div></section>
</main>
<script>
const base=new URL('../mesh/',location.href),key=new URL(location.href).searchParams.get('apikey');
const $=id=>document.getElementById(id);
function url(path){const u=new URL(path,base);if(key)u.searchParams.set('apikey',key);return u}
const data=value=>value?.result??value;
async function request(path,options){const r=await fetch(url(path),options);const v=await r.json().catch(()=>({error:`HTTP ${r.status}`}));if(!r.ok||v?.error){const error=v.error;const message=typeof error==='string'?error:error?.error||error?.message||JSON.stringify(error||v);throw Error(message)}return v}
async function call(name,args,service='ble'){const body={...(args||{})};body.id=Date.now();const out=await request(`services/${encodeURIComponent(service)}/call/${encodeURIComponent(name)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('result').replaceChildren();const h=document.createElement('strong');h.textContent=`Response · ${name}`;const pre=document.createElement('pre');pre.textContent=JSON.stringify(out,null,2);$('result').append(h,pre);return out}
function showStatus(text,error=false){const out=$('status');out.textContent=text;out.className=error?'error':'muted'}
function showSection(id,text,error=false){const out=$(id);out.textContent=text;out.className=error?'error':'muted'}
function showSectionHtml(id,node,error=false){const out=$(id);out.replaceChildren(node);if(error)out.classList.add('error');else out.classList.remove('error')}
async function refreshStatus(){try{const out=await call('ble.status',{});const v=data(out)||{};showSectionHtml('ble-status',Object.assign(document.createElement('pre'),{textContent:JSON.stringify(v,null,2)}))}catch(e){showSection('ble-status',e.message,true)}}
async function refreshResults(){try{const out=await call('ble.scan_results',{limit:32});const v=data(out)||{};const root=$('results');root.replaceChildren();const results=v.results||[];if(!results.length){root.append(Object.assign(document.createElement('p'),{className:'muted',textContent:'No scan results yet.'}));return}const table=document.createElement('table');const head=document.createElement('tr');for(const text of ['Address','RSSI','Service data','Actions'])head.append(Object.assign(document.createElement('th'),{textContent:text}));table.append(head);for(const item of results){const row=document.createElement('tr');const address=document.createElement('td');address.append(Object.assign(document.createElement('address'),{textContent:item.address||'unknown'}));const rssi=document.createElement('td');rssi.textContent=item.rssi??'—';const svc=document.createElement('td');svc.textContent=item.service_data||'—';const actions=document.createElement('td');const connect=document.createElement('button');connect.textContent='Connect';connect.onclick=()=>connectDevice(item.address);const disconnect=document.createElement('button');disconnect.textContent='Disconnect';disconnect.onclick=()=>disconnectDevice();actions.append(connect,' ',disconnect);row.append(address,rssi,svc,actions);table.append(row)}root.append(table)}catch(e){showSectionHtml('results',Object.assign(document.createElement('p'),{className:'error',textContent:e.message}),true)}}
async function connectDevice(address){if(!address)return;try{await call('ble.connect',{address,psm:128});await refreshStatus();showStatus('Connect requested for '+address)}catch(e){showStatus('Connect failed for '+address+': '+e.message,true)}}
async function disconnectDevice(){try{await call('ble.disconnect',{});await refreshStatus();showStatus('Disconnect requested')}catch(e){showStatus('Disconnect failed: '+e.message,true)}}
$('refresh-status').onclick=refreshStatus;
$('scan').onclick=async()=>{try{await call('ble.scan',{});showSection('scan-error','');showStatus('BLE scan started');setTimeout(refreshResults,1000)}catch(e){showSection('scan-error',e.message,true)}};
$('scan-stop').onclick=async()=>{try{await call('ble.scan_stop',{});showSection('scan-error','');showStatus('BLE scan stopped')}catch(e){showSection('scan-error',e.message,true)}};
$('clear').onclick=async()=>{try{await call('ble.scan_clear',{});await refreshResults();showStatus('BLE scan results cleared')}catch(e){showSection('scan-error',e.message,true)}};
$('refresh-results').onclick=refreshResults;
$('activate').onclick=async()=>{const target=$('target').value.trim();$('activate-error').textContent='';if(!target){$('activate-error').textContent='Target MAC is required.';return}try{const kind=Number($('kind').value),nan=kind===6;await call('transport.start',{target_mac:target,kind,ap:nan?Number($('ap').value):0,now:nan?Number($('now').value):0,ble:Number($('ble').value),nan_dw_interval:nan?Number($('dw').value):0},'transport');showStatus('NAN activation sent to '+target)}catch(e){$('activate-error').textContent=e.message}};
(async()=>{try{await refreshStatus();await refreshResults()}catch(e){showStatus(e.message,true)}})();
</script></body></html>
