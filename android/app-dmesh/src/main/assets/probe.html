<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mesh probe</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#62718a;--line:#d5ddeb;--accent:#075ec7;--bad:#a22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}header,main{max-width:900px;margin:auto;padding:18px}h1{font-size:24px;margin:0}section{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px}.muted{color:var(--muted)}.error{color:var(--bad)}button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}label{display:grid;gap:4px;margin:10px 0;color:var(--muted);font-size:13px}input,select,textarea{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;max-width:100%}textarea{min-height:80px}pre{max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer;color:var(--accent)}
  </style>
</head>
<body>
  <header><h1>Mesh probe</h1><p class="muted">Run the public end-to-end probe when this mesh advertises it.</p></header>
  <main><section id="probe"><p class="muted">Loading the intended interface…</p></section></main>
  <script>
    const base=new URL('../mesh/',location.href),key=new URL(location.href).searchParams.get('apikey'),root=document.getElementById('probe');
    const url=path=>{const value=new URL(path,base);if(key)value.searchParams.set('apikey',key);return value};
    async function request(path,options){const response=await fetch(url(path),options);const value=await response.json().catch(()=>({error:`HTTP ${response.status}`}));if(!response.ok)throw Error(value.error||`HTTP ${response.status}`);return value}
    const fields=schema=>schema?.properties||schema?.input_schema?.properties||{};
    function input(name,spec){const label=document.createElement('label'),title=spec.title||name;label.textContent=spec.description?`${title} — ${spec.description}`:title;let control;if(spec.enum){control=document.createElement('select');for(const value of spec.enum)control.add(new Option(String(value),value))}else if(spec.type==='boolean'){control=document.createElement('input');control.type='checkbox'}else if(spec.type==='object'||spec.type==='array'){control=document.createElement('textarea');control.placeholder='JSON'}else{control=document.createElement('input');control.type=spec.type==='number'||spec.type==='integer'?'number':'text'}control.name=name;label.append(control);return label}
    async function load(){try{const registry=await request('services');let capability;for(const service of registry.services||[]){const catalog=await request(`services/${encodeURIComponent(service.name)}/tools?view=default`);for(const item of Array.isArray(catalog)?catalog:catalog.tools||[]){if(item.name==='probe.run'){capability={service:service.name,item};break}}if(capability)break}root.replaceChildren();if(!capability){root.append(Object.assign(document.createElement('p'),{className:'muted',textContent:'probe.run is not registered by this mesh yet. This page will become available when the executing public probe contract is advertised.'}));return}const heading=document.createElement('h2');heading.textContent=capability.item.title||'Run probe';const summary=document.createElement('p');summary.className='muted';summary.textContent=capability.item.description||'Execute a bounded end-to-end probe.';const form=document.createElement('form'),result=document.createElement('pre');for(const [name,spec] of Object.entries(fields(capability.item.input_schema||capability.item.parameters||capability.item)))form.append(input(name,spec));const run=document.createElement('button');run.className='primary';run.textContent='Run probe';form.append(run);form.onsubmit=async event=>{event.preventDefault();const args={};for(const control of form.querySelectorAll('[name]')){if(control.type==='checkbox')args[control.name]=control.checked;else if(control.tagName==='TEXTAREA'){if(control.value)args[control.name]=JSON.parse(control.value)}else if(control.value)args[control.name]=control.type==='number'?Number(control.value):control.value}try{const value=await request(`services/${encodeURIComponent(capability.service)}/call/probe.run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});result.textContent=JSON.stringify(value,null,2)}catch(error){result.textContent=error.message;result.className='error'}};root.append(heading,summary,form,result)}catch(error){root.replaceChildren(Object.assign(document.createElement('p'),{className:'error',textContent:error.message}))}}load();
  </script>
</body>
</html>
