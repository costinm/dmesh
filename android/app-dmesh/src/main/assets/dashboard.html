// Keep both actions visible in every discovery view.  Fetch inventory is a
// read of the selected node's existing observations; active discovery asks
// that node to transmit discovery before fetching the updated snapshot.
const renderNodesWithDiscoveryActions=renderNodes;
renderNodes=function(){
  renderNodesWithDiscoveryActions();
  const actions=$('nodes').querySelector('.row');
  if(!actions)return;
  const refresh=[...actions.querySelectorAll('button')].find(button=>button.textContent==='Refresh');
  if(refresh){
    refresh.textContent='Fetch inventory';
    refresh.title='Read the selected node\'s current discovery inventory; this does not send active discovery.';
  }
  const discover=tool('transport.discover');
  if(!discover)return;
  let button=[...actions.querySelectorAll('button')].find(value=>value.textContent==='Discover');
  if(!button){
    button=document.createElement('button');
    button.className='primary';
    actions.prepend(button);
  }
  button.textContent='Query now';
  button.title='Send active discovery from the selected node, then fetch its inventory.';
  button.onclick=async()=>{try{
    const out=state.viewTarget
      ?await callDirected(discover,{nan:true},state.viewTarget,`Discover from ${state.viewLabel}`,true)
      :await call(discover,{nan:true},'Query now',true);
    await refreshNodes();
    show(state.viewTarget?`Query ${state.viewLabel}`:'Query now',out);
  }catch(error){show(state.viewTarget?`Query ${state.viewLabel}`:'Query now',null,error.message)}};
  const view=actions.querySelector('select');
  if(view)view.onchange=async()=>{state.viewTarget=view.value;const selected=state.rootNodes.find(node=>explorerTarget(node)===view.value);state.viewLabel=selected?readableNode(selected):'This server';try{await refreshNodes()}catch(error){show('Fetch discovery inventory',null,error.message)}};
};
</script></body></html>
