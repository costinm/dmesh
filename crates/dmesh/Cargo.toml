[package]
name = "dmesh"
version = "0.0.1"
edition = "2021" 

[features]
default = ["jni-wrapper"]
jni-wrapper = ["dep:jni"]

[dependencies]
ssh-mesh = { path = "/ws/rust/ssh-mesh/crates/ssh-mesh" }
mesh-tun = { path = "/ws/rust/ssh-mesh/crates/tun", default-features = false }
lmesh = { path = "/ws/rust/ssh-mesh/crates/lmesh" }
mesh = { path = "/ws/rust/ssh-mesh/crates/mesh" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.7"
log = "0.4"
libc = "0.2"
hyper-util = { version = "0.1", features = ["full"] }
tun-rs = { version = "2.8", features = ["async"] }
serde_json = "1"

# Optional Java/Android wrapper
jni = { version = "0.21.1", optional = true }

[dev-dependencies]
tempfile = "3.3"
serial_test = "3.0"

[lib]
name = "dmesh"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dmesh"
path = "src/main.rs"
