[package]
name = "dmesh"
version.workspace = true
edition.workspace = true

[features]
default = ["jni-wrapper"]
jni-wrapper = ["dep:jni"]

[dependencies]
# Keep shared defaults on Git. scripts/build-android.sh can generate an
# untracked Cargo patch for local ssh-mesh checkouts via DMESH_SSH_MESH_DIR.
ssh-mesh = { git = "https://github.com/costinm/ssh-mesh", package = "ssh-mesh" }
mesh-tun = { git = "https://github.com/costinm/ssh-mesh", package = "mesh-tun", default-features = false }
lmesh = { git = "https://github.com/costinm/ssh-mesh", package = "lmesh" }
mesh = { git = "https://github.com/costinm/ssh-mesh", package = "mesh" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.7"
log = "0.4"
libc = "0.2"
hyper-util = { version = "0.1", features = ["full"] }
tun-rs = { version = "2.8", features = ["async"] }
serde_json = "1"

# Optional Java/Android wrapper
jni = { version = "0.21.1", optional = true }

[dev-dependencies]
tempfile = "3.3"
serial_test = "3.0"

[lib]
name = "dmesh"
crate-type = ["rlib", "cdylib"]
