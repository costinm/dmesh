[package]
name = "quic-lite"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
std = []
tokio = ["std", "dep:libc", "dep:tokio"]

[dependencies]
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex"] }
smallvec = { version = "1", default-features = false }
libc = { version = "0.2", optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync"] }

[lib]
name = "quic_lite"
path = "src/lib.rs"

[[example]]
name = "tokio_stream"
required-features = ["tokio"]
