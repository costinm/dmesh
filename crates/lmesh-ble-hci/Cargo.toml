[package]
name = "lmesh-ble-hci"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
libc = "0.2"
dmesh-discovery = { path = "../dmesh-discovery", features = ["tokio"] }
async-trait = "0.1"
mesh-api = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["host-pools"] }
quic-base = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["std"] }
quic-link = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["tokio"] }
quic-mux = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }


[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }
