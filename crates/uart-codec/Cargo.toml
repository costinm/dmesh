[package]
name = "uart-codec"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "uart_codec"

[features]
host = ["dep:libc", "dep:tokio", "mesh-api/host-pools"]
# Linux controller enrollment over a physical UART (`companion.pair kind=uart`).
pair = ["host", "dep:dmesh-discovery", "dep:quic-link", "dep:quic-mux", "dep:async-trait", "tokio/rt", "tokio/time", "tokio/io-util"]

[dependencies]
mesh-api = { git = "https://github.com/costinm/ssh-mesh", default-features = false }
libc = { version = "0.2", optional = true }
quic-link = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["tokio"], optional = true }
quic-mux = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["tokio"], optional = true }
dmesh-discovery = { path = "../dmesh-discovery", features = ["tokio"], optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", default-features = false, features = ["net", "sync"], optional = true }

[dev-dependencies]
dmesh-discovery = { path = "../dmesh-discovery", features = ["tokio"] }
mesh-api = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["host-pools"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt"] }
