[package]
name = "uart-codec"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "uart_codec"

[features]
host = ["dep:libc", "dep:tokio", "quic-lite/tokio"]

[dependencies]
libc = { version = "0.2", optional = true }
quic-lite = { path = "../quic-lite" }
tokio = { version = "1", default-features = false, features = ["net", "sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt"] }
