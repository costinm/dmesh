[package]
name = "lmesh"
version = "0.0.1"
edition = "2024"
autoexamples = false

[dependencies]
dmesh-rawnan = { path = "../rawnan", features = ["linux"] }
dmesh-discovery = { path = "../dmesh-discovery", features = ["tokio"] }
mesh-api = { git = "https://github.com/costinm/ssh-mesh", package = "mesh-api" }
quic-base = { git = "https://github.com/costinm/ssh-mesh" }
quic-link = { git = "https://github.com/costinm/ssh-mesh", features = ["tokio"] }
quic-mux = { git = "https://github.com/costinm/ssh-mesh", features = ["tokio"] }
quic-tools = { git = "https://github.com/costinm/ssh-mesh", features = ["tokio"] }
lmesh-wifi = { path = "../lmesh-wifi" }
lmesh-wpa = { path = "../lmesh-wpa" }
lmesh-ble-hci = { path = "../lmesh-ble-hci" }
uart-codec = { path = "../uart-codec", features = ["host", "pair"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tracing = "0.1"
serde = {version = "1.0.130", features = ["derive"]}
serde_json = "1.0"
toml = "0.8"
sha2 = "0.11"
p256 = { version = "=0.14.0-rc.7", features = ["pem", "ecdsa"] }
rand = "0.10"
anyhow = "1.0"
async-trait = "0.1"
libc = "0.2"
mesh = { git = "https://github.com/costinm/ssh-mesh", package = "mesh" }
minicbor = "2.2"

[lib]
name = "lmesh"
