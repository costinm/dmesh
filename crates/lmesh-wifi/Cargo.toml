[package]
name = "lmesh-wifi"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
dmesh-server = { path = "../dmesh-server", features = ["udp"] }
dmesh-rawnan = { path = "../rawnan" }
quic-lite = { path = "../quic-lite" }
libc = "0.2"
minicbor = "2.2"
sha2 = "0.11"
p256 = { version = "=0.14.0-rc.7", features = ["pem", "ecdsa"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mesh = { git = "https://github.com/costinm/ssh-mesh", package = "mesh" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1"

[lib]
name = "lmesh_wifi"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lmesh-wifi"
path = "src/main.rs"
