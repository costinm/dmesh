[package]
name = "mesh-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mesh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
mesh = { path = "../mesh" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
