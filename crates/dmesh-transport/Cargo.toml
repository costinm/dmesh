[package]
name = "dmesh-transport"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
udp = ["std", "dep:anyhow", "dep:dmesh-object-store", "dep:tokio", "dep:tracing"]
std = []

[lib]
name = "dmesh_transport"
path = "src/lib.rs"

[dev-dependencies]
dmesh-object-store = { path = "../dmesh-object-store" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tempfile = "3"

[dependencies]
anyhow = { version = "1.0", optional = true }
dmesh-object-store = { path = "../dmesh-object-store", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
