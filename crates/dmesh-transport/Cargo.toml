[package]
name = "dmesh-transport"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
udp = ["std", "dep:anyhow", "dep:dmesh-object-store", "dep:libc", "dep:tokio", "dep:tracing"]
std = []

[lib]
name = "dmesh_transport"
path = "src/lib.rs"

[[example]]
name = "recovery-iperf-server"
required-features = ["udp"]
# This is the persistent standalone hardware listener. Compile it in the
# normal UDP test target set so a TransportControl API change cannot leave
# the live benchmark running an older binary.
test = true

[[test]]
name = "running_lmesh_wifi"
required-features = ["udp"]

[dev-dependencies]
dmesh-object-store = { path = "../dmesh-object-store" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tempfile = "3"

[dependencies]
anyhow = { version = "1.0", optional = true }
dmesh-object-store = { path = "../dmesh-object-store", optional = true }
libc = { version = "0.2", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
