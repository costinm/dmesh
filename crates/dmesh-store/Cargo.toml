[package]
name = "dmesh-store"
version = "0.0.1"
edition = "2024"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tracing = "0.1"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "dmesh_store"
