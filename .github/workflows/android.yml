name: Android

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      DMESH_ANDROID_ABIS: arm64-v8a armeabi-v7a x86_64
      DMESH_UI_ANDROID_ABIS: arm64-v8a armeabi-v7a x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
          yes | sdkmanager --licenses >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build debug APKs
        run: ./scripts/build-android.sh build debug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dmesh-debug-apks
          path: target/apk/debug/*.apk
          if-no-files-found: error
