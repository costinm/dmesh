[workspace]
members = [
    "crates/dmesh-android",
    "crates/dmesh-store",
    "crates/dmesh-server",
    "crates/dmesh-discovery",
    "crates/quic-lite",
    "crates/dmeshtui",
    "crates/dmeshtui-android",
    "crates/lmesh",
    "crates/lmesh-wifi",
    "crates/uart-codec",
    "crates/lmesh-ble-hci",
    "crates/lmesh-wpa",
    "crates/rawnan",
    "crates/tun",
    "crates/android-control",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# DMesh routinely builds release artifacts for Android, host radio services,
# and ESP firmware from one long-lived target directory. Keep release builds
# incremental too: production optimization remains enabled, while unchanged
# dependency crates are reused between focused radio iterations.
[profile.release]
incremental = true
