[workspace]
members = [
    "crates/dmesh-android",
    "crates/dmesh-store",
    "crates/dmesh-discovery",
    "crates/dmeshtui",
    "crates/dmeshtui-android",
    "crates/lmesh",
    "crates/lmesh-wifi",
    "crates/uart-codec",
    "crates/lmesh-ble-hci",
    "crates/lmesh-wpa",
    "crates/rawnan",
    "crates/tun",
    "crates/android-control",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[patch."https://github.com/costinm/ssh-mesh"]
mesh-api = { path = "../rust/ssh-mesh/crates/mesh-api" }
mesh = { path = "../rust/ssh-mesh/crates/mesh" }
quic-base = { path = "../rust/ssh-mesh/crates/quic-base" }
quic-mux = { path = "../rust/ssh-mesh/crates/quic-mux" }
quic-link = { path = "../rust/ssh-mesh/crates/quic-link" }
quic-relay = { path = "../rust/ssh-mesh/crates/quic-relay" }
quic-tools = { path = "../rust/ssh-mesh/crates/quic-tools" }

# DMesh routinely builds release artifacts for Android, host radio services,
# and ESP firmware from one long-lived target directory. Keep release builds
# incremental too: production optimization remains enabled, while unchanged
# dependency crates are reused between focused radio iterations.
[profile.release]
incremental = true
